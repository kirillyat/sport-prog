# Публикация документации на GitHub Pages.
#
# Содержимое не дублируется: страницы собираются из README, docs/, DEPLOY,
# EXAM и CONTRIBUTING репозитория. Правка в них сразу становится правкой сайта.
name: Документация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз; начатую не обрываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить mkdocs
        run: pip install mkdocs-material

      - name: Собрать страницы из файлов репозитория
        run: |
          # docs/ лежит на сайте там же, где в репозитории: тогда ссылки
          # README → docs/… и docs/… → соседняя страница не нужно переписывать.
          mkdir -p site-src/docs
          cp README.md site-src/index.md
          cp docs/*.md site-src/docs/
          cp DEPLOY.md site-src/deploy.md
          cp EXAM.md site-src/exam.md
          cp CONTRIBUTING.md site-src/contributing.md
          cp README.en.md site-src/english.md
          # Ссылки между файлами репозитория ведут на .md в корне (из docs/ —
          # через ../), а на сайте те же файлы лежат под другими именами.
          # Разделитель «#», потому что «|» занят перечислением.
          sed -Ei 's#\]\((\.\./)?DEPLOY\.md#](\1deploy.md#g; s#\]\((\.\./)?EXAM\.md#](\1exam.md#g; s#\]\((\.\./)?CONTRIBUTING\.md#](\1contributing.md#g; s#\]\((\.\./)?README\.en\.md#](\1english.md#g; s#\]\((\.\./)?README\.md#](\1index.md#g' site-src/*.md site-src/docs/*.md
          # Ссылки на исходники на сайте вести некуда — отправляем их в репозиторий.
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          sed -Ei "s#\]\((\.\./)?((app|scripts|migrations|tests)/[^)]*|LICENSE|AGENTS\.md|\.env\.example|pyproject\.toml)\)#](${blob}/\2)#g" site-src/*.md site-src/docs/*.md

      - name: Построить сайт
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

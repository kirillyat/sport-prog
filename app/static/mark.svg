<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" role="img" aria-label="знак портала">
  <!-- Знак по умолчанию: фигурные скобки и приглашение командной строки «>_».
       Нейтральный нарочно — своё учреждение кладёт логотип в DATA_DIR/branding,
       не трогая исходники и не пересобирая образ.
       Всё центрировано на (140, 100): скобки симметричны, а «>_» вместе
       занимает 104…180 по горизонтали и 72…130 по вертикали. -->
  <g fill="none" stroke="#111" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M100 20 q-32 0 -32 32 v22 q0 18 -24 26 q24 8 24 26 v22 q0 32 32 32"/>
    <path d="M180 20 q32 0 32 32 v22 q0 18 24 26 q-24 8 -24 26 v22 q0 32 -32 32"/>
    <path d="M104 72 L132 100 L104 128"/>
    <path d="M148 130 H180"/>
  </g>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msu-sport"
version = "0.1.0"
description = "Портал подготовки к спортивному программированию"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
# Верхние границы по мажорам: без них сборка через полгода может подтянуть
# несовместимую версию и упасть уже на сервере.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.18,<1",
    "itsdangerous>=2.2,<3",
    # Показ ноутбуков и конспектов. Чистый Python, html внутри markdown экранирует.
    "markdown-it-py>=3,<4",
    # Формулы $...$ в markdown — отдельным типом токенов, а не регуляркой.
    "mdit-py-plugins>=0.4,<1",
    # TeX → MathML: формулы рисует сам браузер, ни JS, ни шрифтов не нужно.
    "latex2mathml>=3.77,<4",
    # Подсветка кода на сервере — по той же причине.
    "pygments>=2.18,<3",
]

[tool.setuptools]
packages = ["app", "app.platforms", "app.routers", "app.services"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Миграции генерирует Alembic, а course/ — чужой контент из репозитория курса:
# ни то, ни другое мы не форматируем.
extend-exclude = ["migrations/versions", "course"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# В FastAPI вызов в значении по умолчанию — это объявление параметра, а не ловушка.
extend-immutable-calls = ["fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

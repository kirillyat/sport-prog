# Сайт документации на GitHub Pages.
#
# Страницы не пишутся отдельно: они собираются из тех же README, docs/,
# DEPLOY, EXAM и CONTRIBUTING, что лежат в репозитории. Иначе документация
# разъезжается — на сайте одно, в репозитории другое, и никто не знает,
# чему верить. Раскладку делает шаг «Собрать страницы» в workflow.
site_name: Портал тренировок по программированию
site_description: "Учебный портал: задания с LeetCode и Codeforces, табло, проверка решений"
site_url: https://kirillyat.github.io/sport-prog/
repo_url: https://github.com/kirillyat/sport-prog
repo_name: kirillyat/sport-prog
edit_uri: ""

docs_dir: site-src

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

# Якоря тоже проверяются: подробности переехали из README в docs/, и ссылка
# на исчезнувший раздел должна ронять сборку, а не вести в начало страницы.
validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  # Разметка внутри HTML: README центрирует шапку и ставит возможности
  # в две колонки, а GitHub такую разметку понимает и без расширения.
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      # Якоря из русских заголовков: стандартный slugify выбрасывает кириллицу,
      # и ссылка вида (#языки) переставала вести куда-либо.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Портал: index.md
  - Что умеет: docs/features.md
  - Установка и выкатка: docs/install.md
  - Настройка: docs/configuration.md
  - Вход и аккаунты: docs/login.md
  - Задания и зачёт: docs/scoring.md
  - Разделы портала: docs/sections.md
  - Устройство: docs/internals.md
  - Контрольная: exam.md
  - Развёртывание: deploy.md
  - Участие: contributing.md
  - In English: english.md

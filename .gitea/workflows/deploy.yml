# Выкатка портала через Gitea Actions.
#
# Раннер зарегистрирован с меткой `algo:host`: шаги выполняются прямо на нашей
# виртуалке, а не в контейнере. Так задача зовёт те же скрипты выкатки, что
# лежат на машине, вместо того чтобы городить docker внутри docker.
#
# Тесты прогоняются внутри выкатки, до подмены контейнера: сломанное просто
# не доедет до прода.
#
# Каталог .gitea/workflows перекрывает .github/workflows — второго набора
# workflow у репозитория нет.
name: Выкатка

on:
  push:
    branches: [main]
  # Ручной запуск кнопкой «Run workflow» на вкладке Actions.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: algo
    steps:
      - name: Забрать main и выкатить
        # Вывод дублируем в лог на сервере: историю видно и в Gitea, и на машине.
        run: /usr/local/bin/sport-autodeploy 2>&1 | tee -a /srv/autodeploy.log
